<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View and manage your preserved food pantry."
    />
    <title>Homestead Pantry | My Pantry</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/pantry.js"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main>
      <section class="hero">
        <h1>My Pantry</h1>
        <p>
          See everything you have put up and keep track of what to use next.
        </p>
      </section>
      <section class="add-section">
        <h2>Add an item</h2>
        <form id="addItemForm" class="pantry-form">
          <label>
            Item name
            <input type="text" name="name" required />
          </label>

          <label>
            Category
            <select name="category" required>
              <option value="">Choose...</option>
              <option value="Fruits">Fruits</option>
              <option value="Vegetables">Vegetables</option>
              <option value="Sauces">Sauces</option>
              <option value="Pickles">Pickles</option>
              <option value="Dried Goods">Dried Goods</option>
            </select>
          </label>

          <div class="form-row">
            <label>
              Quantity
              <input type="number" name="quantity" min="1" value="1" required />
            </label>
            <label>
              Expiration date
              <input type="date" name="expiration" required />
            </label>
          </div>

          <button type="submit" class="btn">Add to pantry</button>
        </form>
      </section>

      <section class="pantry-section">
        <h2>Your items</h2>

        <div class="pantry-stats">
          <div class="stat">
            <span id="statTotal">0</span><small>Items</small>
          </div>
          <div class="stat">
            <span id="statSoon">0</span><small>Expiring soon</small>
          </div>
          <div class="stat">
            <span id="statCats">0</span><small>Categories</small>
          </div>
        </div>

        <div class="pantry-controls">
          <input type="text" id="pantrySearch" placeholder="Search items..." />
          <select id="pantryFilter">
            <option value="">All categories</option>
            <option value="Fruits">Fruits</option>
            <option value="Vegetables">Vegetables</option>
            <option value="Sauces">Sauces</option>
            <option value="Pickles">Pickles</option>
            <option value="Dried Goods">Dried Goods</option>
          </select>
        </div>

        <ul id="pantryList" class="pantry-grid"></ul>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
