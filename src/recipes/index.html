<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find recipes that use what you have in your pantry."
    />
    <title>Homestead Pantry | Recipes</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="module" src="/js/recipes.js"></script>
  </head>

  <body>
    <header id="main-header" class="divider"></header>

    <main>
      <section id="searchView">
        <div class="hero">
          <h1>Find Recipes</h1>
          <p>Search by an ingredient to find recipes you can make.</p>
        </div>

        <form id="recipeSearchForm" class="search-form">
          <input
            type="text"
            id="ingredientInput"
            name="ingredient"
            placeholder="e.g. chicken, peach, tomato"
            aria-label="Search recipes by ingredient"
            required
          />
          <button type="submit" class="btn">Search</button>
        </form>

        <ul id="recipeList" class="recipe-grid"></ul>
      </section>

      <section id="detailView" hidden></section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
